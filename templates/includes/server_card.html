<div class="card glass-card h-100 border-0 shadow-lg" style="background: rgba(30, 30, 50, 0.6); backdrop-filter: blur(10px);">
    <div class="card-header border-bottom border-secondary bg-transparent d-flex justify-content-between align-items-center">
        <div>
            <span class="badge bg-primary me-2"><i class="fas fa-globe"></i> {{ server.country }}</span>
            <span class="fw-bold">{{ server.name }}</span>
        </div>
        <span class="badge {% if server.status == 'online' %}bg-success{% else %}bg-danger{% endif %} rounded-pill">
            {{ server.status|upper }}
        </span>
    </div>
    <div class="card-body">
        <div class="mb-3">
            <small class="text-muted d-block">Domain/Host</small>
            <div class="d-flex align-items-center">
                <i class="fas fa-server text-info me-2"></i>
                <span class="text-white">{{ server.domain or server.ip_address }}</span>
            </div>
        </div>
        <div class="mb-3">
            <small class="text-muted d-block">ISP</small>
            <div class="d-flex align-items-center">
                <i class="fas fa-network-wired text-warning me-2"></i>
                <span class="text-white">{{ server.isp }}</span>
            </div>
        </div>
        <div class="mb-3">
            <small class="text-muted d-block">Features</small>
            <div>
                <span class="badge bg-secondary">WS</span>
                <span class="badge bg-secondary">TLS</span>
                <span class="badge bg-secondary">UDP</span>
            </div>
        </div>

        <!-- Stats Bar -->
        {% if server.stats %}
            {% set s = server.stats | from_json %}
            <div class="mb-1 d-flex justify-content-between text-muted small">
                <span>Load</span>
                <span>{{ s.cpu }}% CPU / {{ s.ram }}% RAM</span>
            </div>
            <div class="progress" style="height: 5px;">
                <div class="progress-bar bg-success" role="progressbar" style="width: {{ s.cpu }}%"></div>
            </div>
        {% endif %}
    </div>
    <div class="card-footer border-0 bg-transparent">
        <button class="btn btn-outline-light w-100 fw-bold"
                data-bs-toggle="modal"
                data-bs-target="#buyModal"
                data-server-id="{{ server.id }}"
                data-server-name="{{ server.name }}"
                data-protocol="{{ protocol_override|default('udp') }}">
            <i class="fas fa-shopping-cart me-2"></i> CREATE ACCOUNT
        </button>
    </div>
</div>

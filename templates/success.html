{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 text-center">
        <div class="glass-card border-success">
            <div class="display-1 text-success mb-3">
                <i class="fas fa-check-circle"></i>
            </div>
            <h2 class="text-success mb-4">Pembayaran Berhasil!</h2>
            <p class="lead">Akun Anda telah aktif.</p>

            <div class="my-5">
                <p class="text-muted">PIN Akun Anda:</p>
                <div class="display-4 text-white fw-bold user-select-all bg-dark rounded p-3" style="letter-spacing: 5px;">
                    {{ pin }}
                </div>
                <small class="text-danger">*Simpan PIN ini. Anda membutuhkannya untuk melihat detail akun.</small>
            </div>

            <div class="d-grid gap-2">
                <a href="{{ url_for('dashboard') }}" class="btn btn-outline-light">Kembali ke Dasbor</a>
                <form action="{{ url_for('list_accounts') }}" method="POST" style="display:inline;">
                    <input type="hidden" name="pin" value="{{ pin }}">
                    <button type="submit" class="btn btn-custom w-100">Lihat Detail Akun</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

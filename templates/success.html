{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 text-center">
        <div class="glass-card border-success">
            <div class="display-1 text-success mb-3">
                <i class="fas fa-check-circle"></i>
            </div>
            <h2 class="text-success mb-4">Pembayaran Berhasil!</h2>
            <p class="lead">Akun Anda telah aktif.</p>

            <div class="my-5">
                <p class="text-muted">PIN Akun Anda:</p>
                <div class="display-4 text-white fw-bold user-select-all bg-dark rounded p-3" style="letter-spacing: 5px;">
                    {{ pin }}
                </div>
                <small class="text-danger">*Simpan PIN ini. Anda membutuhkannya untuk melihat detail akun.</small>
            </div>

            {% if config_uri %}
            <div class="mb-5">
                <h5><i class="fas fa-qrcode text-warning"></i> Config / QR Code</h5>
                <div class="text-center bg-white p-3 rounded mb-3 d-inline-block">
                        <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data={{ config_uri }}" alt="QR Config" class="img-fluid">
                </div>
                <div class="bg-black p-3 rounded position-relative text-start">
                    <code id="configUri" class="d-block text-break user-select-all" style="font-size: 0.8rem;">{{ config_uri }}</code>
                    <button class="btn btn-sm btn-light position-absolute top-0 end-0 m-2" onclick="copyConfig('configUri')">Copy</button>
                </div>
            </div>
            {% endif %}

            <div class="d-grid gap-2">
                <a href="{{ url_for('dashboard') }}" class="btn btn-outline-light">Kembali ke Dasbor</a>
                <form action="{{ url_for('list_accounts') }}" method="POST" style="display:inline;">
                    <input type="hidden" name="pin" value="{{ pin }}">
                    <button type="submit" class="btn btn-custom w-100">Lihat Detail Akun</button>
                </form>
            </div>
        </div>
    </div>
</div>
<script>
function copyConfig(elementId) {
    var copyText = document.getElementById(elementId).innerText;

    if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(copyText).then(function() {
            alert("Config copied!");
        });
    } else {
        var textArea = document.createElement("textarea");
        textArea.value = copyText;
        textArea.style.position = "fixed";
        textArea.style.left = "0";
        textArea.style.top = "0";
        textArea.style.opacity = "0";
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        try {
            document.execCommand('copy');
            alert("Config copied!");
        } catch (err) {}
        document.body.removeChild(textArea);
    }
}
</script>
{% endblock %}
